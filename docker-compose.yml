services:
    adm:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-https://api.boleia.ao}
        container_name: boleia-adm
        restart: unless-stopped
        networks:
            - boleia

networks:
    boleia:
        name: boleia
        external: true
